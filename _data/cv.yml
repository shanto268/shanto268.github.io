- title: Professional Experience
  type: time_table
  contents:
    - title: Research Intern
      institution: Google, Mountain View, CA
      year: August 2025 - August 2026
      description:
        - R&D for Quantum Processors @ Google Quantum AI
    - title: Summer Research Intern
      institution: Quantum Elements Inc., Thousand Oaks, CA
      year: May 2025 - August 2025
      description:
        - "Built a production agentic AI framework that runs superconducting quantum experiments end to end, coordinating multiple specialized agents so they can calibrate, measure, diagnose, and analyze results without a physicist in the loop."
        - "Architected the full-stack backend underneath it, with custom APIs, scalable databases, and containerized microservices on AWS, uniting the company's ML models, simulators, and instrument control into one system agents could act on through MCP servers."
        - "Designed the evaluation and tracing layer that made agent behavior measurable, turning open-ended autonomous runs into tracked metrics and reproducible traces engineers could debug."
        - "Contributed modular calibration nodes and DAG-based calibration graphs to QUAlibrate, Quantum Machines' open-source framework for large-scale QPUs, cutting processor tune-up from hours to minutes."
    - title: Graduate Research Assistant
      institution: Levenson-Falk Lab (LFL), University of Southern California
      year: 2022 - Present
      description:
        - "Creator and lead developer of SQuADDS, an open-source platform that takes superconducting device design from weeks to minutes; published in Quantum (2024) and adopted by academic and industrial groups worldwide."
        - "Leading the development of generalizable foundation ML models for quantum device simulation and design, in collaboration with NVIDIA, Northeastern University, and Fermilab."
        - "Co-leading development of an agent harness with Lawrence Berkeley National Laboratory that carries a device from design through simulation to tape-out readiness end to end."
        - "Developed and validated a high-yield nanofabrication process for nanobridge-SQUID resonators with 15 nm features, scaling functional device yield from under 2% to over 90%."
        - "Designed, fabricated, and measured nanobridge resonators, offset-charge-sensitive transmons, trimon devices, dissipator devices and custom Josephson parametric amplifiers, along with the PCBs, packages, and cryogenic microwave chain that house and measure them."
        - "Built a Hidden Markov Model inference pipeline that extracts real-time quasiparticle occupation from I/Q trajectory data."
        - "Leading Andreev bound state spectroscopy and nanoSQUID quasiparticle trap experiments to characterize and mitigate quasiparticle-induced decoherence in superconducting qubits."
        - "Led the creation of a fully automated design-to-simulation-to-GDS pipeline for the lab, with the Ansys and Palace simulation stack on USC's HPC cluster."
        - "Leading the open-source integration of AWS Quantum's EM solver Palace with Quantum-Metal, giving the hardware community scalable cloud-based simulation pipelines."
        - "Mentored five graduate and six undergraduate researchers through device design, fabrication, and measurement projects."
    - title: Teaching Assistant
      institution: University of Southern California
      year: 2021 - 2022
      description:
        - "Led lab sessions in Fundamentals of Physics II: Electricity and Magnetism for undergraduate engineering students."
        - "Topics covered included circuits, Gauss' Law, Faraday's Law, and resonance studies."
    - title: Undergraduate Research Assistant
      institution: Advanced Particle Detector Laboratory (APDL), Texas Tech University
      year: 2018 - 2021
      description:
        - "Led optical-system upgrades for muon telescopes; developed custom Winston cones that improved signal efficiency from 20% to 78%."
        - "Built DAQ systems with Arduino, CAMAC crates, and custom PCBs; reduced channel deadtime by 300x using multithreaded sync and FPGA logic."
        - "Developed Geant4-based MC simulation and a custom ML architecture for 3D tomographic reconstruction from 2D muon detector data."
    - title: Summer Research Intern
      institution: Institute for Software Integrated Systems (ISIS), Vanderbilt University
      year: 2020
      description:
        - "Built a calibration pipeline for microscopic traffic models, parallelized with Ray for 10x+ speedup."
        - "Contributed to the Flow RL framework for closed-loop learning in calibrated traffic environments."
        - "Co-authored a peer-reviewed conference paper on microsimulation calibration."
    - title: Teaching Assistant, Quantum Information and Computation
      institution: Texas Tech University
      year: 2020
      description:
        - "Developed interactive Jupyter notebooks using IBM's Qiskit for quantum information education."
        - "Covered quantum teleportation, Grover's Algorithm, VQE, and Jordan's Algorithm."
    - title: Undergraduate Research Assistant
      institution: Texas Tech Multidisciplinary Research in Transportation (TechMRT)
      year: 2019 - 2020
      description:
        - "Developed an open-source simulator for heterogeneous AV/HV traffic using an extended Nagel-Schreckenberg CA model."
        - "Integrated RL agents to study flow stability and throughput; co-authored a journal paper on AV/HV composition effects."

