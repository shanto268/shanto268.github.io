name: Validate SEO and machine-readable discovery

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - "_config.yml"
      - "_includes/**"
      - "_pages/**"
      - "_projects/**"
      - "_bibliography/**"
      - "_data/publications.json"
      - "assets/json/**"
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "Gemfile"
      - "Gemfile.lock"
      - "bin/check-seo"
      - "bin/sync-arxiv-publications"
      - "tests/test_sync_arxiv_publications.py"
      - ".github/seo-test-config.yml"
      - ".github/workflows/seo.yml"
      - ".github/workflows/sync-arxiv.yml"
  push:
    branches:
      - master
      - main
    paths:
      - "_config.yml"
      - "_includes/**"
      - "_pages/**"
      - "_projects/**"
      - "_bibliography/**"
      - "_data/publications.json"
      - "assets/json/**"
      - "robots.txt"
      - "llms.txt"
      - "llms-full.txt"
      - "Gemfile"
      - "Gemfile.lock"
      - "bin/check-seo"
      - "bin/sync-arxiv-publications"
      - "tests/test_sync_arxiv_publications.py"
      - ".github/seo-test-config.yml"
      - ".github/workflows/seo.yml"
      - ".github/workflows/sync-arxiv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install notebook build dependencies
        run: python -m pip install --upgrade nbconvert
      - name: Validate build, JSON-LD, sitemap, and crawler policy
        run: bash bin/check-seo
